name: Run Scrapers and Update Data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrapers
  cancel-in-progress: true

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 pandas playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ensure output directory exists
        run: mkdir -p output

      - name: Run scraping scripts (FAIL if any fails)
        env:
          OUT_DIR: output
        run: |
          set -e
          python supersport2.py
          python sunbet2.py
          python betjets2.py

      - name: Debug output + git status
        run: |
          echo "==== output folder ===="
          ls -la output || true
          echo "==== git status ===="
          git status --porcelain
          echo "==== preview (if exists) ===="
          head -n 5 output/sunbet_premier.csv || true
          head -n 40 output/sunbet_premier.json || true

      - name: Commit and push updated data (only if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output
          git diff --cached --quiet || git commit -m "Auto-update scraped data [skip ci]"
          git push
