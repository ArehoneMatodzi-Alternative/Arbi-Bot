name: Run Scrapers and Update Data
on:
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes (safer than 5)
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # Needed to push changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: Ensure output directory exists
        run: mkdir -p output
      
      - name: Run scraping scripts
        run: |
          python supersport_scraper.py || echo "supersport failed"
          python sunbet_scraper.py || echo "sunbet failed"
          python betjets_scraper.py || echo "betjets failed"
          python betfred_epl.py || echo "betfred failed"
      
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Auto-update scraped data [skip ci]"
          git push
