name: Run All Scrapers and Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

permissions:
  contents: write

concurrency:
  group: scrapers
  cancel-in-progress: true

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      
      - name: Ensure output directory exists
        run: mkdir -p output
      
      - name: Run Supersport scraper
        env:
          OUT_DIR: output
        run: |
          echo "🏃 Running Supersport scraper..."
          python supersport2.py && echo "✅ Supersport: SUCCESS" || echo "❌ Supersport: FAILED"
        continue-on-error: true
      
      - name: Run Sunbet scraper
        env:
          OUT_DIR: output
        run: |
          echo "🏃 Running Sunbet scraper..."
          python sunbet2.py && echo "✅ Sunbet: SUCCESS" || echo "❌ Sunbet: FAILED"
        continue-on-error: true
      
      - name: Run BetJets scraper
        env:
          OUT_DIR: output
          BETJETS_URL: https://betjets.co.za/en/sports/soccer/england/epl/1195
        run: |
          echo "🏃 Running BetJets scraper..."
          python betjets2.py && echo "✅ BetJets: SUCCESS" || echo "❌ BetJets: FAILED"
        continue-on-error: true
      
      - name: Run Betfred EPL scraper
        env:
          OUT_DIR: output
        run: |
          echo "🏃 Running Betfred scraper..."
          python betfred_epl.py && echo "✅ Betfred: SUCCESS" || echo "❌ Betfred: FAILED"
        continue-on-error: true
      
      - name: Display scraping summary
        if: always()
        run: |
          echo "================================================"
          echo "📊 SCRAPING SUMMARY"
          echo "================================================"
          echo ""
          echo "📁 Output directory contents:"
          ls -lh output/ || echo "No output directory found"
          echo ""
          echo "📄 Files created/updated:"
          find output -type f -name "*.csv" -o -name "*.json" 2>/dev/null || echo "No CSV/JSON files found"
          echo ""
          echo "💾 File sizes:"
          du -sh output/* 2>/dev/null || echo "No files to measure"
          echo ""
      
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_number }}
          path: |
            output/
            *.log
          retention-days: 7
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all output files
          git add output/*.csv output/*.json output/*.png output/*.html output/*.txt 2>/dev/null || true
          
          # Check if there are any changes
          if git diff --staged --quiet; then
            echo "✨ No changes to commit - all data is up to date"
            exit 0
          fi
          
          # Commit with detailed message
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "🤖 Auto-update scraped odds - ${TIMESTAMP} [skip ci]"
          
          # Push changes
          git push
          
          echo "✅ Successfully pushed updated data to repository"
